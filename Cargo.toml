[package]
name = "fablic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
nucleo-matcher = "0.3.1"
open = "5.4.4"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "system-proxy", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
terminal-colorsaurus = "1.0.3"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
