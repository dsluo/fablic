name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate tag and Cargo version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Invalid release tag: {tag!r}; expected X.Y.Z")
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if tag != version:
              raise SystemExit(f"Release tag {tag!r} does not match Cargo version {version!r}")
          PY

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yaml

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: rust

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: mise run build-release -- --target "$TARGET"

      - name: Smoke test
        run: |
          "target/${TARGET}/release/fablic" --fake --snapshot 'j enter F'

      - name: Package
        shell: bash
        run: |
          archive="fablic-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/${archive}"
          cp "target/${TARGET}/release/fablic" README.md CHANGELOG.md "dist/${archive}/"
          tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
